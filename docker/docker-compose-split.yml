services:
  ragflow-cpu:
    cpus: "16.0"
    mem_limit: ${RAGFLOW_CPU_MEM_LIMIT:-64g}
    mem_reservation: ${RAGFLOW_CPU_MEM_RESERVATION:-32g}
    memswap_limit: ${RAGFLOW_CPU_MEMSWAP_LIMIT:-64g}
    command:
      - --enable-adminserver
      - --disable-taskexecutor

  ragflow-executor:
    cpus: "8.0"
    mem_limit: ${RAGFLOW_EXECUTOR_MEM_LIMIT:-32g}
    mem_reservation: ${RAGFLOW_EXECUTOR_MEM_RESERVATION:-16g}
    memswap_limit: ${RAGFLOW_EXECUTOR_MEMSWAP_LIMIT:-32g}
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    command:
      - --disable-webserver
      - --disable-datasync
      - --workers=4
      - --host-id=ragflow-executor
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../history_data_agent:/ragflow/history_data_agent
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"